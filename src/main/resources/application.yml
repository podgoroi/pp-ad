spring:
  cloud:
    openfeign:
      clients:
        fcl:

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:1234/postgres
    username: postgres
    password: 1234

  jpa:
    hibernate:
      ddl-auto: create

    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    open-in-view: true
    properties:
      hibernate:
        format_sql: true
